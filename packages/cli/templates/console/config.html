<!doctype html>
<html lang="zh"><head><meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fabric 控制台 · 配置</title>
<link rel="stylesheet" href="/assets/shell.css" />
<script src="/assets/shell.js"></script>
<style>
  /* 页面专有规则。令牌 / body 基线 / .navbar / .seg 来自 /assets/shell.css。 */
  main{max-width:980px;margin:0 auto;padding:22px 18px 60px}
  .intro{color:var(--text-tertiary);font-size:13px;margin:0 0 18px;line-height:1.7}
  .sec{margin-bottom:26px}
  .sec>h2{margin:0 0 2px;font-size:14px;font-weight:600;color:var(--text)}
  .sec>.sub{margin:0 0 10px;font-size:12px;color:var(--text-tertiary);line-height:1.6}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px}
  .card h3{margin:0 0 4px;font-size:12px;font-weight:600;color:var(--text-secondary);
    text-transform:uppercase;letter-spacing:.04em}
  /* 搜索框跨两层过滤。放在最上面:它是「我知道要改哪一项」时的主路径。 */
  .searchbar{margin:0 0 16px}
  .searchbar input{font:inherit;font-size:13px;width:100%;box-sizing:border-box;
    padding:8px 11px;color:var(--text);background:var(--surface);
    border:1px solid var(--border-strong);border-radius:var(--radius-sm)}
  /* 已修改竖条:占位始终存在(3px + 间距),否则改一项会让整行横移。 */
  .frow{display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:start;
    padding:12px 0 12px 11px;border-bottom:1px solid var(--border);
    border-left:3px solid transparent}
  .frow:last-child{border-bottom:none}
  .frow.mod{border-left-color:var(--accent)}
  .fkey{font-family:var(--mono);font-size:12px;color:var(--text-tertiary)}
  .flabel{font-size:13px;color:var(--text);margin-bottom:2px}
  .fdesc{font-size:12px;color:var(--text-tertiary);line-height:1.6}
  .fctl{display:flex;align-items:center;gap:8px;justify-self:end}
  .fctl input,.fctl select{font:inherit;font-size:12px;padding:4px 7px;min-width:132px;
    color:var(--text);background:var(--surface-2);border:1px solid var(--border-strong);
    border-radius:var(--radius-sm)}
  .fctl button{font:inherit;font-size:12px;padding:4px 11px;cursor:pointer;color:#fff;
    background:var(--accent);border:1px solid transparent;border-radius:var(--radius-sm)}
  /* 恢复默认是次要动作,给它次要的样子 —— 与「保存」同等醒目会让人误点。 */
  .fctl button.ghost{color:var(--text-secondary);background:transparent;
    border-color:var(--border-strong)}
  .fctl button:disabled,.fctl input:disabled,.fctl select:disabled{opacity:.5;cursor:not-allowed}
  /* 多选项走勾选框而不是逗号分隔的文本框:这一项存在的理由就是不必再手打枚举值。
     竖排是因为选项名本身要读得懂,横排挤在一行会先被截断的正是它。 */
  .fctl.multi{display:grid;grid-template-columns:1fr;gap:6px;justify-self:end;min-width:200px}
  .chk{display:flex;flex-direction:column;gap:3px}
  .chk label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary);
    cursor:pointer}
  .chk input[type=checkbox]{min-width:0;margin:0;accent-color:var(--accent)}
  .fctl.multi .btns{display:flex;gap:8px;justify-content:flex-end}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;
    border:1px solid var(--border-strong);color:var(--text-secondary);margin-left:6px}
  /* env 用警示色:它同时意味着"这是当前生效值"和"你在这里改不动"。 */
  .tag.env{color:#b45309;border-color:#b45309}
  .tag.cur{color:var(--accent);border-color:var(--accent)}
  [data-theme="dark"] .tag.env{color:#fbbf24;border-color:#fbbf24}
  .note{font-size:11px;color:var(--text-tertiary);margin-top:4px;line-height:1.6}
  .note.warn{color:#b45309}
  [data-theme="dark"] .note.warn{color:#fbbf24}
  /* 预设卡:三档并排,每档标出它实际会写入的数值。 */
  .presets{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .preset{flex:1 1 180px;text-align:left;font:inherit;cursor:pointer;padding:11px 13px;
    color:var(--text);background:var(--surface-2);border:1px solid var(--border-strong);
    border-radius:var(--radius-sm)}
  .preset:disabled{cursor:default}
  .preset.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .preset .pn{font-size:13px;font-weight:500;display:block;margin-bottom:4px}
  .preset .pv{font-size:11px;color:var(--text-tertiary);line-height:1.7;display:block}
  /* 折叠区:标题整行可点。收起时不渲染内容,搜索命中时强制展开。 */
  .disc{margin-bottom:12px}
  .dhead{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;
    user-select:none;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow)}
  .dhead .caret{color:var(--text-tertiary);font-size:11px;width:10px}
  .dhead .dt{font-size:13px;color:var(--text);font-weight:500}
  .dhead .dc{margin-left:auto;font-size:12px;color:var(--text-tertiary)}
  /* 项目行:整块可展开。收起时只给一行摘要,展开后才是覆盖列表 + 添加控件。 */
  .prow{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;
    background:var(--surface);box-shadow:var(--shadow)}
  .phead{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;
    user-select:none}
  .phead .pname{font-size:13px;color:var(--text);font-weight:500}
  .phead .ppath{font-family:var(--mono);font-size:11px;color:var(--text-tertiary);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:340px}
  .phead .pcount{margin-left:auto;font-size:12px;color:var(--text-tertiary);white-space:nowrap}
  .phead .caret{color:var(--text-tertiary);font-size:11px;width:10px}
  .pbody{padding:0 14px 12px;border-top:1px solid var(--border)}
  .addbar{display:flex;align-items:center;gap:8px;padding:12px 0 2px;flex-wrap:wrap}
  .addbar select,.addbar input{font:inherit;font-size:12px;padding:4px 7px;color:var(--text);
    background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--radius-sm)}
  .addbar button{font:inherit;font-size:12px;padding:4px 11px;cursor:pointer;color:#fff;
    background:var(--accent);border:1px solid transparent;border-radius:var(--radius-sm)}
  .empty{padding:18px 16px;text-align:center;color:var(--text-tertiary);font-size:13px;
    line-height:1.8}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:9;
    font-size:12px;padding:8px 14px;border-radius:var(--radius-sm);color:#fff;
    background:#111827;box-shadow:var(--shadow);opacity:0;transition:opacity .18s}
  .toast.show{opacity:.94}
  .toast.bad{background:#b91c1c}
  .guide{padding:20px 18px;text-align:center;line-height:1.9;color:var(--text-tertiary);font-size:13px}
  .err{color:#ef4444}
  code{font-family:var(--mono);font-size:12px;background:var(--surface-2);
    border-radius:var(--radius-sm);padding:1px 5px}
</style></head><body>
<nav class="navbar">
  <h1 class="nav-title">Fabric 控制台</h1>
  <a class="seg" href="/">知识</a>
  <a class="seg" href="/graph">关联图</a>
  <a class="seg" href="/status">状态</a>
  <a class="seg" href="/config">配置</a>
  <span class="spacer"></span>
  <button class="seg" id="shellThemeBtn" title="切换主题">☀</button>
</nav>
<main id="main"><div class="guide">…</div></main>
<div class="toast" id="toast"></div>
<script>
(function(){
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':'&quot;'; }); }
  function fmt(tpl,vars){ return String(tpl).replace(/\{(\w+)\}/g,function(m,k){
    return vars[k]==null?m:vars[k]; }); }

  var DATA=null;
  var GROUP_ORDER=['A_locale','B_hint_threshold','C_audit','D_behavior'];
  // 展开状态按 project id 记住:保存后要重新拉数据重渲染,不记的话每次保存都会
  // 把用户正在编辑的那一行收起来。
  var OPEN={};
  var ADV=false;   // 高级区是否展开
  var Q='';        // 搜索词

  function toast(msg,bad){
    var el=document.getElementById('toast');
    el.textContent=msg; el.className='toast show'+(bad?' bad':'');
    setTimeout(function(){ el.className='toast'+(bad?' bad':''); },3600);
  }

  // 搜索命中标签、说明与 key 三处。只搜标签会让人搜不到自己在 JSON 里见过的
  // key 名,而 key 名往往正是他来这一页的原因。
  function hit(f){
    if(!Q) return true;
    var q=Q.toLowerCase();
    return (f.label+' '+f.description+' '+f.key).toLowerCase().indexOf(q)>=0;
  }

  function control(f,target){
    if(!f.editable){
      // env 顶着时不渲染禁用控件而是直接不给控件:一个点不动的输入框会让人反复
      // 试,不如把原因说在它本来的位置上。
      return '<span class="note warn">'+esc(fmt(DATA.strings['env-locked'],{name:f.envVar}))+'</span>';
    }
    var id='c'+Math.random().toString(36).slice(2,9);
    var t=esc(JSON.stringify(target));
    // 恢复默认只在这一层真的有值时出现 —— 对一个本就继承来的项提供"恢复默认",
    // 点下去什么也不会发生,是一个骗人的控件。
    var reset=f.modified
      ? '<button class="ghost" data-reset="'+esc(f.key)+'" data-target="'+t+'">'+
        esc(DATA.strings.reset)+'</button>' : '';
    var save='<button data-ctl="'+id+'" data-key="'+esc(f.key)+
      '" data-target="'+t+'">'+esc(DATA.strings.save)+'</button>';

    if(f.widget==='multiselect'){
      // 勾选框只更新这个隐藏 input,保存仍旧读 #id 的 .value —— 三个写动作共用
      // 一条通道,多一个"这一类控件怎么取值"的分支就多一处会忘记同步的地方。
      // 逗号串正是服务端 validate 接受的形式,所以传输层不需要认识哪些 key 是集合。
      var on={}; String(f.effective||'').split(',').forEach(function(v){
        if(v) on[v]=true; });
      var boxes=(f.enumValues||[]).map(function(v){
        return '<label><input type="checkbox" data-set="'+id+'" value="'+esc(v)+'"'+
          (on[v]?' checked':'')+' />'+esc(v)+'</label>';
      }).join('');
      return '<div class="fctl multi"><div class="chk">'+boxes+'</div>'+
        '<input type="hidden" id="'+id+'" value="'+esc(f.effective)+'" />'+
        '<div class="btns">'+reset+save+'</div></div>';
    }

    var input;
    if(f.widget==='select'){
      input='<select id="'+id+'">'+(f.enumValues||[]).map(function(v){
        return '<option value="'+esc(v)+'"'+(v===f.effective?' selected':'')+'>'+esc(v)+'</option>';
      }).join('')+'</select>';
    } else {
      input='<input type="text" id="'+id+'" value="'+esc(f.effective)+'" />';
    }
    return '<div class="fctl">'+input+reset+save+'</div>';
  }

  // 语义检索开关下面那一行:开关是意图,能不能算是另一回事。只挂在机器视角这一行,
  // 因为探测到的是机器的事实(装没装 fastembed、模型在不在盘上),不随项目变。
  function semanticNote(f,target,s){
    if(f.key!=='embed_enabled'||target.scope!=='machine') return '';
    var ss=DATA.semanticSearch; if(!ss) return '';
    var text;
    if(!ss.enabled) text=s['semantic.off'];
    else if(ss.remote) text=s['semantic.remote'];
    else if(ss.blocker==='model-missing')
      text=fmt(s['semantic.model-missing'],{model:ss.model,dir:ss.modelCacheDir});
    else if(ss.blocker==='package-missing') text=s['semantic.package-missing'];
    else text=s['semantic.ready'];
    return '<div class="note'+(ss.blocker==='package-missing'?' warn':'')+'">'+esc(text)+'</div>';
  }

  function row(f,target){
    var tag='<span class="tag'+(f.source==='env'?' env':'')+'">'+esc(f.sourceLabel)+'</span>';
    // 没生效但存在的 env 变量也要标出来 —— 用户排查"我改了怎么没用"时,这一行
    // 往往就是答案。
    var envNote=(f.envVar&&f.source!=='env')
      ? '<div class="note">'+esc(fmt(DATA.strings['env-available'],{name:f.envVar}))+'</div>' : '';
    return '<div class="frow'+(f.modified?' mod':'')+'"'+
      (f.modified?' title="'+esc(DATA.strings.modified)+'"':'')+'><div>'+
      '<div class="flabel">'+esc(f.label)+tag+'</div>'+
      '<div class="fkey">'+esc(f.key)+'</div>'+
      '<div class="fdesc">'+esc(f.description)+'</div>'+envNote+
      semanticNote(f,target,DATA.strings)+
      '</div>'+control(f,target)+'</div>';
  }

  // ---- 提醒频率预设 -------------------------------------------------------
  // 三档并排,每档展开它实际会写入的 8 个数值。只给档位名而不给数值,等于让用户
  // 在三个不知道含义的词里选一个。
  function presetCard(s){
    var ap=DATA.archivePreset;
    var byKey={}; DATA.machine.forEach(function(f){ byKey[f.key]=f; });
    var cards=ap.options.map(function(o){
      var lines=ap.keys.map(function(k){
        var f=byKey[k];
        return esc((f?f.label:k)+'：'+o.values[k]);
      }).join('<br>');
      return '<button class="preset'+(ap.active===o.id?' on':'')+'" data-preset="'+esc(o.id)+
        '"><span class="pn">'+esc(s['preset.'+o.id])+'</span><span class="pv">'+lines+'</span></button>';
    }).join('');
    var custom=ap.active===null
      ? '<div class="note">'+esc(s['preset.custom'])+' — '+esc(s['preset.custom-hint'])+'</div>' : '';
    return '<div class="card"><h3>'+esc(s['preset.title'])+'</h3>'+
      '<div class="fdesc">'+esc(s['preset.intro'])+'</div>'+custom+
      '<div class="presets">'+cards+'</div></div>';
  }

  // ---- 常用 / 高级 --------------------------------------------------------
  function commonSection(s){
    var fields=DATA.machine.filter(function(f){ return f.tier==='common'&&hit(f); });
    var html='<section class="sec"><h2>'+esc(s['machine.title'])+'</h2>'+
      '<p class="sub">'+esc(s['machine.intro'])+'</p>';
    // 预设卡本身是一项设置,搜索时按它覆盖的 8 个键是否命中来决定去留。
    var presetHit=!Q||DATA.machine.some(function(f){
      return DATA.archivePreset.keys.indexOf(f.key)>=0&&hit(f); });
    var count=fields.length+(presetHit?1:0);
    // 搜索时一节都没命中就整节不出现 —— 一个下面什么也没有的小标题读起来像
    // 「这里本该有东西但坏了」。
    if(Q&&!count) return {html:'',count:0};
    if(presetHit) html+=presetCard(s);
    if(fields.length){
      html+='<div class="card">'+fields.map(function(f){
        return row(f,{scope:'machine'}); }).join('')+'</div>';
    }
    return {html:html+'</section>',count:count};
  }

  function advancedSection(s){
    var fields=DATA.machine.filter(function(f){ return f.tier==='advanced'&&hit(f); });
    if(Q&&!fields.length) return {html:'',count:0};
    // 搜索有词时强制展开:否则用户搜到东西却看见一个收起的盒子,等同于没搜到。
    var open=ADV||!!Q;
    var head='<div class="dhead" data-adv="1"><span class="caret">'+(open?'▾':'▸')+
      '</span><span class="dt">'+esc(s['advanced.title'])+'</span>'+
      '<span class="dc">'+esc(fmt(s['advanced.count'],{count:fields.length}))+'</span></div>';
    var body='';
    if(open&&fields.length){
      body='<p class="sub" style="margin:10px 0 8px">'+esc(s['advanced.intro'])+'</p>';
      GROUP_ORDER.forEach(function(g){
        var inGroup=fields.filter(function(f){ return f.group===g; });
        if(!inGroup.length) return;
        body+='<div class="card"><h3>'+esc(s['group.'+g])+'</h3>'+
          inGroup.map(function(f){ return row(f,{scope:'machine'}); }).join('')+'</div>';
      });
    }
    return {html:'<section class="sec disc">'+head+body+'</section>',count:fields.length};
  }

  function projectRow(p,s,open){
    var target={scope:'project',projectId:p.projectId};
    var badges=(p.isCurrent?'<span class="tag cur">'+esc(s['projects.current'])+'</span>':'')+
      // 两种 origin 都是"不在机器登记表里",补救动作相同(回该仓库跑 fabric install)。
      (p.origin==='config-only'||p.origin==='current-only'
        ?'<span class="tag">'+esc(s['projects.unregistered'])+'</span>':'')+
      (p.stale?'<span class="tag">'+esc(s['projects.stale'])+'</span>':'');
    var count=p.overrides.length
      ? fmt(s['projects.override-count'],{count:p.overrides.length})
      : s['projects.no-overrides'];

    var body='';
    if(!p.editable){
      // 未绑 store → 没有 project_id → 没有可写的位置。不给控件,给原因和下一步。
      body='<div class="note warn" style="padding:10px 0">'+esc(s['projects.unbound'])+'</div>';
    } else {
      body=p.overrides.map(function(f){ return row(f,target); }).join('');
      // 可加的项 = 全机器那些 preference 键里,这个项目还没单独设过的。
      var taken={}; p.overrides.forEach(function(f){ taken[f.key]=1; });
      var addable=DATA.machine.filter(function(f){
        return f.home==='preference' && !taken[f.key]; });
      if(addable.length){
        var selId='a'+(p.projectId||'x').replace(/[^a-z0-9]/gi,'');
        body+='<div class="addbar"><select id="'+selId+'"><option value="">'+
          esc(s['projects.add-placeholder'])+'</option>'+
          addable.map(function(f){
            return '<option value="'+esc(f.key)+'">'+esc(f.label)+'</option>'; }).join('')+
          '</select><button data-add="'+selId+'" data-target="'+esc(JSON.stringify(target))+
          '">'+esc(s['projects.add'])+'</button></div>';
      }
    }

    return '<div class="prow"><div class="phead" data-toggle="'+esc(p.projectId||p.path)+'">'+
      '<span class="caret">'+(open?'▾':'▸')+'</span>'+
      '<span class="pname">'+esc(p.name)+'</span>'+badges+
      (p.path?'<span class="ppath">'+esc(p.path)+'</span>':'')+
      '<span class="pcount">'+esc(count)+'</span></div>'+
      (open?'<div class="pbody">'+body+'</div>':'')+'</div>';
  }

  // 搜索必须穿透下面两节。只过滤全机器那一节的话,搜一个词会得到「没有匹配」加
  // 三行仍然摆在那里的无关设置 —— 页面同时给出两个互相矛盾的答案。
  function projectsSection(s){
    // 搜索时项目节只保留命中的覆盖项;搜到零项的项目整行不出现。
    var rows=DATA.projects.map(function(p){
      return {p:p,overrides:p.overrides.filter(hit)};
    }).filter(function(r){ return !Q||r.overrides.length; });
    var count=rows.reduce(function(n,r){ return n+r.overrides.length; },0);
    if(Q&&!count) return {html:'',count:0};

    var html='<section class="sec"><h2>'+esc(s['projects.title'])+'</h2>'+
      '<p class="sub">'+esc(s['projects.intro'])+'</p>';
    if(!rows.length){
      // 空态是这台机器当前的真实状态,不是错误。给出可执行的下一步。
      html+='<div class="card"><div class="empty">'+esc(s['projects.empty'])+'<br>'+
        esc(s['projects.empty-hint'])+'</div></div>';
    } else {
      html+=rows.map(function(r){
        // 搜索时把该项目当成只有命中的那几项,展开状态也强制打开 —— 否则搜到的
        // 东西藏在一行收起的摘要后面,等同于没搜到。
        var p=Q?Object.assign({},r.p,{overrides:r.overrides}):r.p;
        return projectRow(p,s,Q?true:!!OPEN[p.projectId||p.path]);
      }).join('');
    }
    return {html:html+'</section>',count:count};
  }

  function storesSection(s){
    var rows=DATA.stores.map(function(st){
      return {st:st,fields:st.fields.filter(hit)};
    }).filter(function(r){ return !Q||r.fields.length; });
    var count=rows.reduce(function(n,r){ return n+r.fields.length; },0);
    if(Q&&!count) return {html:'',count:0};

    var html='<section class="sec"><h2>'+esc(s['stores.title'])+'</h2>'+
      '<p class="sub">'+esc(s['stores.intro'])+'</p>';
    if(!rows.length){
      html+='<div class="card"><div class="empty">'+esc(s['stores.empty'])+'</div></div>';
    } else {
      html+=rows.map(function(r){
        return '<div class="card"><h3>'+esc(r.st.alias)+
          (r.st.personal?'<span class="tag">'+esc(s['stores.personal'])+'</span>':'')+'</h3>'+
          r.fields.map(function(f){
            return row(f,{scope:'store',storeUuid:r.st.storeUuid}); }).join('')+'</div>';
      }).join('');
    }
    return {html:html+'</section>',count:count};
  }

  function remoteCard(r,s){
    var body;
    if(!r.configured){ body=esc(s['remote.off']); }
    else {
      body=esc(fmt(s['remote.on'],{host:r.endpointHost||'?'}))+
        '<span class="tag">'+esc(r.hasApiKey?s['remote.key-set']:s['remote.key-missing'])+'</span>'+
        (r.model?'<span class="tag">'+esc(r.model)+'</span>':'');
    }
    // 改法两种状态都给:没开的人要知道去哪儿开,开了的人要知道去哪儿改 —— 这一页
    // 对这三项只读是个决定(其中一项是密钥),那就欠读者一个去处。
    var how='<div class="note">'+esc(fmt(s['remote.how'],{path:r.configPath}))+'</div>';
    return '<section class="sec"><div class="card"><h3>'+esc(s['remote.title'])+
      '</h3><div class="fdesc">'+body+'</div>'+how+'</div></section>';
  }

  function render(){
    var s=DATA.strings;
    var common=commonSection(s), adv=advancedSection(s);
    var proj=projectsSection(s), stores=storesSection(s);
    var total=common.count+adv.count+proj.count+stores.count;
    // 搜索无结果时说清楚是搜索的结果,而不是渲染一片空白让人以为页面坏了。
    var none=(Q&&total===0)
      ? '<div class="card"><div class="empty">'+esc(fmt(s['search-empty'],{q:Q}))+'</div></div>' : '';
    // 远程嵌入卡是状态而非设置项,搜索时一并让位 —— 留着它会让「没有匹配」下面
    // 仍然挂着一张卡。
    var remote=Q?'':remoteCard(DATA.remoteEmbedding,s);

    document.getElementById('main').innerHTML=
      '<p class="intro">'+esc(s.intro)+'</p>'+
      '<div class="searchbar"><input id="q" type="search" placeholder="'+esc(s.search)+
        '" value="'+esc(Q)+'" /></div>'+
      none+common.html+adv.html+proj.html+stores.html+remote;

    var q=document.getElementById('q');
    q.addEventListener('input',function(){
      Q=q.value.trim(); render();
      // 重渲染会换掉这个 input,焦点与光标要自己接回去,否则第二个字符打不进去。
      var n=document.getElementById('q');
      n.focus(); n.setSelectionRange(n.value.length,n.value.length);
    });

    document.querySelectorAll('[data-adv]').forEach(function(el){
      el.addEventListener('click',function(){ ADV=!ADV; render(); });
    });
    document.querySelectorAll('[data-toggle]').forEach(function(el){
      el.addEventListener('click',function(){
        var k=el.getAttribute('data-toggle'); OPEN[k]=!OPEN[k]; render();
      });
    });
    document.querySelectorAll('[data-set]').forEach(function(box){
      box.addEventListener('change',function(){
        var target=box.getAttribute('data-set');
        var picked=[];
        document.querySelectorAll('[data-set="'+target+'"]').forEach(function(b){
          if(b.checked) picked.push(b.value);
        });
        var hidden=document.getElementById(target);
        if(hidden) hidden.value=picked.join(',');
      });
    });
    document.querySelectorAll('[data-ctl]').forEach(function(btn){
      btn.addEventListener('click',function(){
        var ctl=document.getElementById(btn.getAttribute('data-ctl'));
        if(ctl) post('/api/config/set',{key:btn.getAttribute('data-key'),value:ctl.value,
          action:'set',target:JSON.parse(btn.getAttribute('data-target'))},btn,
          function(b){ return fmt(DATA.strings.saved,{target:b.target}); });
      });
    });
    document.querySelectorAll('[data-reset]').forEach(function(btn){
      btn.addEventListener('click',function(){
        post('/api/config/set',{key:btn.getAttribute('data-reset'),action:'reset',
          target:JSON.parse(btn.getAttribute('data-target'))},btn,
          function(b){ return fmt(DATA.strings['reset-done'],{target:b.target}); });
      });
    });
    document.querySelectorAll('[data-preset]').forEach(function(btn){
      btn.addEventListener('click',function(){
        var id=btn.getAttribute('data-preset');
        post('/api/config/preset',{preset:id,target:{scope:'machine'}},btn,function(b){
          return fmt(DATA.strings['preset.applied'],
            {name:DATA.strings['preset.'+id],count:(b.applied||[]).length});
        });
      });
    });
    document.querySelectorAll('[data-add]').forEach(function(btn){
      btn.addEventListener('click',function(){
        var sel=document.getElementById(btn.getAttribute('data-add'));
        if(!sel||!sel.value) return;
        // 新覆盖先落成当前生效值:用户点"添加"是要把这一项固定下来,不是要改它。
        var f=DATA.machine.filter(function(m){ return m.key===sel.value; })[0];
        post('/api/config/set',{key:sel.value,value:f?f.effective:'',action:'set',
          target:JSON.parse(btn.getAttribute('data-target'))},btn,
          function(b){ return fmt(DATA.strings.saved,{target:b.target}); });
      });
    });
  }

  // 三个写动作共用一条通道:成功都要重新拉数据(见下),失败都要说清原因。
  function post(url,body,btn,ok){
    btn.disabled=true;
    fetch(url,{method:'POST',cache:'no-store',
      headers:{'content-type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,body:j}; }); })
    .then(function(res){
      if(!res.ok){
        // 预设是逐键写的,部分失败时已经改了一部分。把两边都说出来,否则用户会
        // 以为什么都没变而去找错方向。
        if(res.body&&res.body.failed){
          toast(fmt(DATA.strings['preset.partial'],{count:res.body.failed.length,
            keys:res.body.failed.map(function(f){ return f.key; }).join(', ')}),true);
          return load();
        }
        throw new Error(res.body&&res.body.error?res.body.error:'HTTP error');
      }
      toast(ok(res.body));
      // 重新拉一次而不是乐观更新:写进哪一层、有没有被 env 顶掉、这一改让预设变
      // 成了哪一档,只有重新 resolve 才知道。乐观更新会显示一个我们并未验证过的
      // 状态。
      return load();
    })
    .catch(function(e){
      toast(fmt(DATA.strings['save-failed'],{reason:e.message}),true);
      btn.disabled=false;
    });
  }

  function load(){
    return fetch('/api/config',{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(d){ DATA=d; render(); })
      .catch(function(e){
        document.getElementById('main').innerHTML=
          '<div class="card"><div class="guide"><span class="err">'+
          esc(DATA&&DATA.strings?DATA.strings['load-failed']:'读取配置失败')+'</span><br>'+
          esc(e.message)+'<br>控制台只连本机,通常是服务已停止 —— 回终端看 '+
          '<code>fabric preview</code> 还在不在跑。</div></div>';
      });
  }

  load();
})();
</script>
</body></html>
