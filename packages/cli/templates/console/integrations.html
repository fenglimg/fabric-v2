<!doctype html>
<html lang="zh"><head><meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fabric 控制台 · 集成</title>
<link rel="stylesheet" href="/assets/shell.css" />
<script src="/assets/shell.js"></script>
<style>
  /* 页面专有规则。令牌 / body 基线 / .navbar / .seg / .frow / .fctl / .note /
     .toast / fx-* 组件层来自 /assets/shell.css。.card / .tag 是每页各自一份 ——
     lumen.html 也定义了同名类,上提会改到它。
     颜色一律走令牌:警示色在深色模式要反过来变亮,写死十六进制就得为每处再写一条
     [data-theme="dark"] 覆盖 —— 之前这个文件里有四条。 */
  main{max-width:1040px;margin:0 auto;padding:22px 18px 60px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:10px}
  .card h3{margin:0 0 6px;font-size:var(--fs-3);font-weight:var(--fw-semibold);color:var(--foreground)}
  .tag{display:inline-block;font-size:var(--fs-1);padding:1px 7px;border-radius:999px;
    border:1px solid currentColor;color:var(--muted-foreground);margin-left:6px}
  .tag.on{color:var(--primary)}
  .tag.off{color:var(--warning)}
  /* 「这一页在说哪个项目」。等宽字用于路径 —— 它是要被拿去比对的字面量,不是散文。 */
  .scopeline{display:flex;align-items:center;gap:6px;margin:8px 0 0;
    font-size:var(--fs-1);font-family:var(--mono);color:var(--muted-foreground)}
  /* provenance —— 与配置页同义:env 是"生效且你在这里改不动",set 是"值就设在
     你正看的这一层",继承来的保持中性灰。 */
  .tag.env{color:var(--warning)}
  .tag.set{color:var(--foreground);border-color:var(--muted-foreground)}
  /* 左客户端列表 / 右详情。窄屏塌成单列 —— 两栏在 720px 以下会把路径挤成一列字。 */
  .split{display:grid;grid-template-columns:190px 1fr;gap:14px;align-items:start}
  @media (max-width:720px){ .split{grid-template-columns:1fr} }
  .clist{display:flex;flex-direction:column;gap:6px}
  .cbtn{font:inherit;text-align:left;cursor:pointer;padding:10px 12px;color:var(--foreground);
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    transition:var(--tx)}
  .cbtn:hover{background:var(--accent)}
  .cbtn:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
  .cbtn.on{border-color:var(--primary);color:var(--primary)}
  .cbtn .cn{font-size:var(--fs-4);font-weight:var(--fw-medium);display:block}
  .cbtn .cs{font-size:var(--fs-1);color:var(--muted-foreground);display:block;margin-top:3px}
  .cbtn .cs.bad{color:var(--warning)}
  /* 文件清单:一致的按组折行,不一致的逐条列出。全列出来是一百多行,而其中
     一百多行说的是同一句「没问题」。 */
  .fg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
  .chip{font-family:var(--mono);font-size:var(--fs-1);padding:2px 7px;border-radius:var(--radius-sm);
    background:var(--muted);color:var(--muted-foreground);border:1px solid transparent}
  .chip.bad{border-color:var(--warning);color:var(--warning)}
  .plist{margin:6px 0 0;padding:0;list-style:none}
  .plist li{font-family:var(--mono);font-size:var(--fs-1);color:var(--muted-foreground);
    padding:3px 0;word-break:break-all}
  .plist li b{font-family:inherit;font-weight:var(--fw-medium);color:var(--warning);margin-right:6px}
  .err{color:var(--destructive)}
  /* 行为标题行:名字 + 状态徽标 + 一枚展开按钮。描述和触发事件收进展开区 ——
     七个行为常驻两行说明就是十四行永远不变的字。 */
  .bhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 6px}
  .bname{font-size:var(--fs-4);font-weight:var(--fw-medium);color:var(--foreground)}
  /* 命令输出:定高可滚,不让一次 install 的几百行把整页推到看不见。 */
  .rout{margin:12px 0 0;padding:10px 12px;max-height:260px;overflow:auto;
    font-family:var(--mono);font-size:var(--fs-1);line-height:1.7;white-space:pre-wrap;
    color:var(--muted-foreground);background:var(--muted);
    border:1px solid var(--border);border-radius:var(--radius-sm)}
  code{font-family:var(--mono);font-size:var(--fs-2);background:var(--muted);
    border-radius:var(--radius-sm);padding:1px 5px}
  .mono{font-family:var(--mono);font-size:var(--fs-2)}
</style></head><body>
<nav class="navbar">
  <h1 class="nav-title">Fabric 控制台</h1>
  <a class="seg" href="/">知识</a>
  <a class="seg" href="/graph">关联图</a>
  <a class="seg" href="/status">状态</a>
  <a class="seg" href="/config">配置</a>
  <a class="seg" href="/integrations">集成</a>
  <span class="spacer"></span>
  <button class="seg" id="shellThemeBtn" title="切换主题">☀</button>
</nav>
<main id="main"><div class="fx-empty"><div class="fx-empty-body">…</div></div></main>
<div class="toast" id="toast"></div>
<script>
(function(){
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':'&quot;'; }); }
  function fmt(tpl,vars){ return String(tpl).replace(/\{(\w+)\}/g,function(m,k){
    return vars[k]==null?m:vars[k]; }); }

  var DATA=null;
  var SEL=null;   // 当前选中的客户端 id
  var ROUT='';    // 最近一次修复的输出,跨重绘保留
  var toast=FabricField.toast;

  function S(k){ return (DATA&&DATA.strings&&DATA.strings[k])||k; }

  // ---- 运行时行为 ---------------------------------------------------------
  // 排在文件清单之前:用户要判断的是「编辑前会不会提示我」,不是
  // `knowledge-pretooluse.cjs` 在不在盘上。文件是这个判断的证据,不是它的单位。
  function presenceNote(b){
    if(b.active) return '';
    // 两种「没运行」的下一步不一样:文件不在要重装,文件在但没登记是客户端配置
    // 被别的东西覆盖了。合成一句「未运行」会让一半的人修错地方。
    var anyFile=b.presence.some(function(p){ return p.file!=='missing'; });
    return '<div class="note warn">'+esc(anyFile?S('behaviors.unregistered'):S('behaviors.file-missing'))+'</div>';
  }

  // 展开区共用一个自增 id。折叠不是删内容 —— 描述和触发事件仍在 DOM 里,
  // 只是从「七个行为常驻十四行说明」变成「想看哪个点哪个」。
  var discSeq=0;
  function disclosure(inner,label){
    var id='x'+(++discSeq);
    return {
      btn:'<button class="fx-disclose" data-desc="'+id+'" aria-expanded="false" '+
        'aria-controls="'+id+'" aria-label="'+esc(label)+'">'+
        FabricIcon.svg('info','fx-ico-sm')+'</button>',
      box:'<div class="fexp" id="'+id+'" data-open="false">'+inner+'</div>',
    };
  }

  function behaviorRow(b){
    var badge='<span class="tag '+(b.active?'on':'off')+'">'+
      esc(b.active?S('behaviors.active'):S('behaviors.inactive'))+'</span>';
    var events=b.events.length
      ? '<div class="fkey">'+esc(b.events.join(' · '))+'</div>' : '';
    var d=disclosure('<div class="fdesc">'+esc(b.description)+'</div>'+events,'说明');
    // 调节项走 shell.js 的同一个控件渲染器,写入走的也是配置页那条
    // POST /api/config/set —— 这一页没有第二条写通道。
    // 写到哪一层由服务端指定 —— 值是按项目层解析出来的,存到机器层就是悄悄把
    // 这项设置挪了一层。
    var target=DATA.writeTarget;
    var keys=b.keys.length
      ? b.keys.map(function(f){
          var fd=disclosure('<div class="fdesc">'+esc(f.description)+'</div>','说明');
          // 出处标签与配置页共用一个渲染器。这一页原先完全不画它,于是一个从
          // 全机器层继承下来的值,在这里和项目自己设的值长得一模一样 —— 而它们
          // 的「移除」按钮做的事完全不同。
          return '<div class="frow'+(f.modified?' mod':'')+'">'+
            '<div class="fmain">'+
            '<span class="flabel">'+esc(f.label)+'</span>'+
            '<span class="fkey">'+esc(f.key)+'</span>'+
            FabricField.sourceTag(f,DATA.strings)+fd.btn+'</div>'+
            FabricField.control(f,target,DATA.strings)+fd.box+'</div>';
        }).join('')
      : '';
    // 被多个 hook 读的 key 只画一次控件(在第一个读它的行为下),这里出一条指回去的
    // 引用 —— 同一个值画三个控件,存了一个另外两个就还显示旧值。
    var shared=b.shared.map(function(s){
      return '<div class="note">'+fmt(S('behaviors.shared'),
        {label:esc(s.label),owner:esc(s.owner)})+'</div>';
    }).join('');
    if(!keys&&!shared) keys='<div class="note">'+esc(S('behaviors.no-keys'))+'</div>';
    // 标题就是行为名。原本每张卡的标题都是同一句「调节项」—— 七个一模一样的
    // 小标题,搜索、目录、屏幕阅读器都没法用它定位,而卡片正上方已经写着这是
    // 哪个行为。让标题去命名它所统领的东西,重复的那一句就不必存在。
    return '<div class="card">'+
      '<h3 class="bhead"><span class="bname">'+esc(b.label)+'</span>'+badge+d.btn+'</h3>'+
      d.box+presenceNote(b)+keys+shared+'</div>';
  }

  // ---- 客户端详情 ---------------------------------------------------------
  function mcpBlock(c){
    var s=c.mcp.connected
      ? fmt(S('mcp.on'),{path:esc(c.mcp.path||'')})
      : fmt(S('mcp.off'),{path:esc(c.mcp.path||'')});
    var loc=c.mcp.location?'<span class="tag">'+esc(S('mcp.location.'+c.mcp.location))+'</span>':'';
    var hint=c.mcp.connected?'':'<div class="note warn">'+esc(S('mcp.off-hint'))+'</div>';
    return '<div class="card"><h3>'+esc(S('mcp.title'))+'</h3>'+
      '<div class="fdesc">'+s+loc+'</div>'+hint+'</div>';
  }

  function bootstrapBlock(c){
    // 三态各自的文案里已经带了下一步(缺失 → 去装;陈旧 → 重跑 install),所以这里
    // 不再另加一句提示 —— 只把不正常的那两态染成警示色。
    var text=fmt(S('bootstrap.'+c.bootstrap.state),{path:esc(c.bootstrap.path)});
    var cls=c.bootstrap.state==='ok'?'fdesc':'note warn';
    return '<div class="card"><h3>'+esc(S('bootstrap.title'))+'</h3>'+
      '<div class="'+cls+'">'+text+'</div></div>';
  }

  function groupList(title,groups){
    if(!groups.length) return '';
    var bad=groups.filter(function(g){ return g.state!=='ok'; });
    var chips=groups.map(function(g){
      return '<span class="chip'+(g.state==='ok'?'':' bad')+'">'+esc(g.id)+'</span>';
    }).join('');
    var files=groups.reduce(function(n,g){ return n+g.fileCount; },0);
    var summary=bad.length
      ? fmt(S('problems.count'),{count:bad.length})
      : fmt(S('files.ok'),{count:files});
    var problems=bad.length
      ? '<ul class="plist">'+bad.map(function(g){
          return g.problems.map(function(p){
            return '<li><b>'+esc(S('state.'+p.state))+'</b>'+esc(p.path)+'</li>';
          }).join('');
        }).join('')+'</ul>'
      : '';
    return '<div class="card"><h3>'+esc(title)+'</h3>'+
      '<div class="fdesc">'+esc(summary)+'</div>'+
      '<div class="fg">'+chips+'</div>'+problems+'</div>';
  }

  function clientDetail(c){
    return mcpBlock(c)+bootstrapBlock(c)+
      groupList(S('files.hooks'),c.hooks)+
      groupList(S('files.skills'),c.skills)+
      groupList(S('files.libs'),c.libs)+
      // 只读不是遗漏。放在文件清单末尾而不是每张卡上 —— 说一次就够,重复三遍
      // 反而像是在为不能改而道歉。
      '<div class="note">'+esc(S('files.readonly'))+'</div>';
  }

  function clientList(){
    return '<div class="clist">'+DATA.clients.map(function(c){
      var sub=c.problems
        ? '<span class="cs bad">'+esc(fmt(S('problems.count'),{count:c.problems}))+'</span>'
        : '<span class="cs">'+esc(S('problems.none'))+'</span>';
      return '<button class="cbtn'+(c.id===SEL?' on':'')+'" data-client="'+esc(c.id)+'">'+
        '<span class="cn">'+esc(c.name)+'</span>'+sub+'</button>';
    }).join('')+'</div>';
  }

  // 修复区。两个按钮就是页面文案里让你去跑的那两条命令 —— 动作名是枚举,路径由
  // 服务端从作用域推出来,请求体里没有任何路径。
  function repairBlock(){
    function btn(action,label,hint){
      return '<div class="frow"><div class="fmain" style="display:block">'+
        '<span class="flabel">'+esc(label)+'</span>'+
        '<div class="fdesc">'+esc(hint)+'</div></div>'+
        '<div class="fctl"><button class="fx-btn sm" data-repair="'+action+'">'+
        FabricIcon.svg('wrench','fx-ico-sm')+esc(label)+'</button></div></div>';
    }
    return sectionHead('wrench',S('repair.title'))+
      '<div class="card"><div class="fdesc">'+esc(S('repair.intro'))+'</div>'+
      btn('install',S('repair.install'),S('repair.install-hint'))+
      btn('doctor-fix',S('repair.doctor'),S('repair.doctor-hint'))+
      // 输出流在跑之前不占位置 —— 一个空的黑框会让人以为有东西没加载出来。
      // 跑完要重新拉数据(文件状态变了),重绘会把这个节点换掉,所以正文存在 ROUT
      // 里再画回来 —— 否则命令刚说完什么,页面就把它擦了。
      '<pre class="rout" id="rout"'+(ROUT?'':' hidden')+'>'+esc(ROUT)+'</pre></div></section>';
  }

  function manifestBlock(){
    var m=DATA.manifest;
    var text=m.status==='ok' ? fmt(S('manifest.ok'),{count:m.tracked})
      : m.status==='drifted' ? fmt(S('manifest.drifted'),{count:m.driftCount,tracked:m.tracked})
      : m.status==='manifest-unreadable' ? S('manifest.unreadable')
      : S('manifest.no-manifest');
    var version=m.fabricVersion
      ? '<div class="note">'+esc(fmt(S('manifest.version'),{version:m.fabricVersion}))+'</div>' : '';
    return sectionHead('file',S('manifest.title'))+
      '<div class="card"><div class="fdesc">'+esc(text)+'</div>'+version+'</div></section>';
  }

  // 段标题:图标 + 名字 + 可选副标题。开标签在这里出,闭标签由调用方补 ——
  // 段落内容各不相同,包成一个函数反而要传五种拼好的字符串进来。
  function sectionHead(icon,title,sub){
    return '<section class="fx-section"><h2 class="fx-section-title">'+
      FabricIcon.svg(icon)+esc(title)+'</h2>'+
      (sub?'<p class="fx-section-desc">'+esc(sub)+'</p>':'');
  }

  function pageHead(){
    // 这一页的每一句话都只对一个项目成立,而选的是哪个项目只写在顶栏那个下拉里。
    // 切到另一个项目后如果两边碰巧一模一样(常见 —— 装出来的东西本就该一样),
    // 页面就没有任何地方能证明切换生效了,读起来就是「点了没反应」。
    var s=DATA.scope;
    var line=s.kind==='project'
      ? '<p class="scopeline">'+FabricIcon.svg('folder','fx-ico-sm')+
        esc(fmt(S('scope-line'),{name:(s.path||'').split('/').pop()||s.projectId||'',
          path:s.path||''}))+'</p>'
      : '';
    return '<div class="fx-page-head"><h1 class="fx-page-title"><b>'+esc(S('title'))+'</b></h1>'+
      '<p class="fx-page-sub">'+esc(S('intro'))+'</p>'+line+'</div>';
  }

  function render(){
    if(DATA.scope.kind==='machine'){
      document.getElementById('main').innerHTML=pageHead()+
        '<div class="fx-empty"><div class="fx-empty-ico">'+FabricIcon.svg('plug','fx-ico-xl')+'</div>'+
        '<div class="fx-empty-title">'+esc(S('machine-only'))+'</div>'+
        '<div class="fx-empty-body">'+esc(S('machine-only-hint'))+'</div></div>';
      return;
    }
    if(SEL===null||!DATA.clients.some(function(c){ return c.id===SEL; }))
      SEL=DATA.clients.length?DATA.clients[0].id:null;
    var current=DATA.clients.filter(function(c){ return c.id===SEL; })[0];

    document.getElementById('main').innerHTML=pageHead()+
      sectionHead('activity',S('behaviors.title'),S('behaviors.intro'))+
      DATA.behaviors.map(behaviorRow).join('')+'</section>'+
      sectionHead('folder',S('files.title'))+
      '<div class="split">'+clientList()+
      '<div>'+(current?clientDetail(current):'')+'</div></div></section>'+
      repairBlock()+manifestBlock();
    wire();
  }

  function wire(){
    document.querySelectorAll('[data-client]').forEach(function(btn){
      btn.addEventListener('click',function(){ SEL=btn.getAttribute('data-client'); render(); });
    });
    // 展开/收起就地改属性,不重绘 —— 重绘会把用户刚展开的另一项也合上。
    document.querySelectorAll('[data-desc]').forEach(function(btn){
      btn.addEventListener('click',function(){
        var box=document.getElementById(btn.getAttribute('data-desc'));
        if(!box) return;
        var open=box.getAttribute('data-open')!=='true';
        box.setAttribute('data-open',open?'true':'false');
        btn.setAttribute('aria-expanded',open?'true':'false');
      });
    });
    document.querySelectorAll('[data-repair]').forEach(function(btn){
      btn.addEventListener('click',function(){ repair(btn); });
    });
    FabricField.bind(document,{
      post:post,
      saved:function(target){ return fmt(DATA.strings.saved,{target:target}); },
      reset:function(target){ return fmt(DATA.strings['reset-done'],{target:target}); },
    });
  }

  // 边跑边显示。这两条命令要跑几十秒并且会重写用户正在看的文件 —— 转个圈然后
  // 说「完成」,他没法区分「跑成功了」和「打了六条警告」。
  function repair(btn){
    var action=btn.getAttribute('data-repair');
    var label=btn.textContent;
    var out=document.getElementById('rout');
    ROUT=''; out.hidden=false; out.textContent='';
    document.querySelectorAll('[data-repair]').forEach(function(b){ b.disabled=true; });
    toast(fmt(S('repair.running'),{action:label}));

    fetch('/api/repair',{method:'POST',cache:'no-store',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({action:action,scope:FabricScope.current()})})
    .then(function(r){
      // 拒绝走的是普通 JSON,只有确定要跑了才会开流 —— 所以这里不必从文本流里
      // 抠错误码出来。
      if(!r.ok) return r.json().catch(function(){ return null; }).then(function(p){
        throw new Error(p&&p.error?p.error:'HTTP '+r.status);
      });
      var dec=new TextDecoder();
      var reader=r.body.getReader();
      return (function pump(){
        return reader.read().then(function(res){
          if(res.done) return;
          ROUT+=dec.decode(res.value,{stream:true});
          out.textContent=ROUT;
          out.scrollTop=out.scrollHeight;
          return pump();
        });
      })();
    })
    .then(function(){
      toast(fmt(S('repair.done'),{action:label}));
      return load();
    })
    .catch(function(e){ toast(e.message,true); })
    .then(function(){
      document.querySelectorAll('[data-repair]').forEach(function(b){ b.disabled=false; });
    });
  }

  // 写入用配置页那条通道,成功后重新拉数据 —— 一个键改完可能让某个行为的
  // 「运行中」判断也变了,乐观更新会显示一个我们没验证过的状态。
  function post(url,body,btn,ok){
    btn.disabled=true;
    fetch(url,{method:'POST',cache:'no-store',
      headers:{'content-type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,body:j}; }); })
    .then(function(res){
      if(!res.ok) throw new Error(res.body&&res.body.error?res.body.error:'HTTP error');
      toast(ok(res.body));
      return load();
    })
    .catch(function(e){ toast(e.message,true); btn.disabled=false; });
  }

  function fail(title,body){
    document.getElementById('main').innerHTML=
      '<div class="fx-empty"><div class="fx-empty-ico">'+FabricIcon.svg('alert','fx-ico-xl')+'</div>'+
      '<div class="fx-empty-title err">'+title+'</div>'+
      '<div class="fx-empty-body">'+body+'</div></div>';
  }

  function load(){
    return fetch('/api/integrations'+FabricScope.param(),{cache:'no-store'})
      .then(function(r){
        if(!r.ok){
          return r.json().catch(function(){ return null; }).then(function(p){
            var d=FabricScope.describeError(r.status,p);
            throw Object.assign(new Error(d.body),{ shown:d });
          });
        }
        return r.json();
      })
      .then(function(d){ DATA=d; render(); })
      .catch(function(e){
        if(e.shown) fail(e.shown.title,e.shown.body);
        else fail(esc(DATA&&DATA.strings?DATA.strings['load-failed']:'读取集成状态失败'),
          esc(e.message)+'<br>控制台只连本机,通常是服务已停止 —— 回终端看 '+
          '<code>fabric preview</code> 还在不在跑。');
      });
  }

  load();
})();
</script>
</body></html>
